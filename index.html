<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiTop Global Lead Finder</title>
<style>
body{font:14px system-ui,"Microsoft YaHei",sans-serif;background:#f2f6f7;color:#19333d;margin:0}header{background:#123847;color:white;padding:22px 4vw}main{max-width:1200px;margin:auto;padding:22px}section{background:#fff;border:1px solid #dce5e9;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-size:12px;color:#536c76;margin:6px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd8df;border-radius:6px;font:inherit}button,a.btn{padding:9px 13px;border:1px solid #b9cbd1;border-radius:7px;background:#fff;color:#234451;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 4px 5px 0}button.primary{background:#087d76;color:white;border-color:#087d76}.muted{color:#637782;font-size:12px}.notice{background:#eef6f6;padding:12px;border-left:3px solid #087d76}.result{border-top:1px solid #e4ecef;padding:12px 0}.result a{overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e2eaed}.scroll{overflow:auto}#toast{position:fixed;right:15px;bottom:15px;background:#123847;color:#fff;padding:12px;border-radius:8px}.hidden{display:none!important}
</style></head><body>
<header><h1>BiTop Global Lead Finder</h1><p>海外 B2B 客户挖掘 · 线索发现 / 证据背调 / 客户分级</p><small>V1.2.1 · ChatGPT 官方账户授权版</small></header>
<main>
<section><h2>ChatGPT 账户授权与模型</h2><div class="grid"><div><label>GitHub Public 源代码仓库 URL</label><input id="repo" value="https://github.com/6ix7even520/BiTop-Global-Lead-Finder"></div><div><label>账户状态</label><div id="authStatus" class="notice">检查中…</div></div><div><label>可用模型</label><select id="model"><option value="">请先连接 ChatGPT</option></select></div></div><button class="primary" id="connect">Continue with ChatGPT</button><button id="refresh">刷新模型</button><button id="disconnect">断开账户</button><a class="btn" href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Manage usage</a></section>
<section><h2>搜索并发现潜在客户</h2><div class="grid"><div><label>国家代码</label><select id="country"><option value="PH">菲律宾</option><option value="ID">印度尼西亚</option><option value="VN">越南</option><option value="TH">泰国</option><option value="MY">马来西亚</option><option value="SG">新加坡</option><option value="KH">柬埔寨</option><option value="TN">突尼斯</option></select></div><div><label>目标产品</label><select id="product"><option>Anti-Rust Lubricant</option><option>Carburetor Cleaner</option><option>Spray Paint</option><option>Brake Cleaner</option><option>A/C System Flush</option><option>Glass Cleaner</option></select></div><div><label>Serper API Key</label><input id="key" type="password" placeholder="仅本次页面内存使用"></div><div><label>搜索关键词</label><input id="query" value="automotive care products importer distributor wholesaler"></div></div><label><input type="checkbox" id="consent"> 我已阅读<a href="/privacy" target="_blank">数据处理说明</a>，同意将搜索词发送给 Serper，并在 AI 背调时将公开企业资料发送给 OpenAI 分析。</label><button class="primary" id="search">搜索候选客户</button><div id="results"></div></section>
<section><h2>AI 企业背调</h2><div class="grid"><div><label>候选企业 / 店铺名称</label><input id="candidate" placeholder="Company / Store name"></div><div><label>企业官网或店铺来源 URL</label><input id="url" placeholder="https://..."></div><div><label>背调深度</label><select id="depth"><option value="quick">快速（2次补充搜索）</option><option value="deep">深度（5次补充搜索）</option></select></div></div><button class="primary" id="research">开始 AI 自动背调</button><div id="report"></div></section>
<section><h2>本地客户数据库</h2><button id="load">刷新客户库</button><a class="btn" href="/api/export">导出 CSV</a><div class="scroll"><table><thead><tr><th>企业/店铺</th><th>国家</th><th>产品</th><th>等级/分数</th><th>联系方式</th><th>跟进状态</th></tr></thead><tbody id="leads"></tbody></table></div></section>
<section><h2>说明</h2><p class="notice">客户数据保存在本机 leads.sqlite3；OAuth 凭据保存在本机并加密。公开仓库仅存程序源代码。AI 背调建议必须人工核实，不代表企业资质认证。搜索与背调均由用户主动发起。</p></section>
</main><div id="toast" class="hidden"></div>
<script>
const $=id=>document.getElementById(id);let results=[],auth={};
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4500)}
async function api(p,d){let r=await fetch('/api/'+p,d===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
async function loadAuth(){try{auth=await api('auth/status');$('authStatus').textContent=auth.connected?(auth.plan_usage_enabled?'已连接并获得计划用量授权：'+(auth.email||''):'已登录，但缺少计划用量授权'):'尚未连接 ChatGPT';$('repo').value=auth.repo_url||$('repo').value;if(auth.plan_usage_enabled)await loadModels()}catch(e){$('authStatus').textContent=e.message}}
async function loadModels(){try{let d=await api('auth/models');$('model').innerHTML=d.models.map(m=>'<option value="'+m.slug+'">'+m.display_name+'</option>').join('');$('model').value=d.selected_model||d.models[0]?.slug||''}catch(e){$('model').innerHTML='<option value="">'+e.message+'</option>'}}
$('connect').onclick=async()=>{try{await api('auth/start',{public_repo_url:$('repo').value.trim()});toast('请在默认浏览器中完成 OpenAI 授权')}catch(e){toast(e.message)}};
$('refresh').onclick=loadModels;$('disconnect').onclick=async()=>{if(!confirm('确定断开 ChatGPT？'))return;try{await api('auth/disconnect',{});await loadAuth()}catch(e){toast(e.message)}};
$('model').onchange=async()=>{try{await api('auth/model',{model:$('model').value})}catch(e){toast(e.message)}};
$('search').onclick=async()=>{if(!$('consent').checked)return toast('请先确认数据处理说明');if(!$('key').value)return toast('请填写 Serper API Key');try{results=await api('search',{q:$('query').value,gl:$('country').value.toLowerCase(),hl:'en',key:$('key').value,privacy_consent:true});$('results').innerHTML=results.map((r,i)=>'<div class="result"><b>'+esc(r.name)+'</b><p>'+esc(r.snippet)+'</p><a target="_blank" rel="noopener" href="'+safe(r.link||r.url)+'">'+esc(r.link||r.url)+'</a><button onclick="choose('+i+')">选为背调对象</button></div>').join('');toast('搜索结果：'+results.length+' 条')}catch(e){toast(e.message)}};
function choose(i){$('candidate').value=results[i].name;$('url').value=results[i].link||results[i].url||''}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return /^https?:\/\//i.test(s||'')?esc(s):'#'}
$('research').onclick=async()=>{if(!$('consent').checked)return toast('请先确认数据处理说明');if(!auth.plan_usage_enabled||!$('model').value)return toast('请先连接 ChatGPT 并选择模型');if(!$('candidate').value)return toast('请填写企业或店铺名称');try{let d=await api('research',{name:$('candidate').value,company:$('candidate').value,url:$('url').value,country:$('country').value,product:$('product').value,serper_key:$('key').value,model:$('model').value,depth:$('depth').value,privacy_consent:true});$('report').innerHTML='<h3>AI 建议：'+esc(d.report.suggested_grade)+' / '+esc(d.report.suggested_score)+'</h3><pre style="white-space:pre-wrap">'+esc(JSON.stringify(d.report,null,2))+'</pre>';toast('背调完成，请人工核实证据')}catch(e){toast(e.message)}};
async function loadLeads(){try{let d=await api('leads');$('leads').innerHTML=d.map(x=>'<tr><td>'+esc(x.company||x.name)+'</td><td>'+esc(x.country)+'</td><td>'+esc(x.product)+'</td><td>'+esc(x.grade)+' / '+esc(x.score)+'</td><td>'+esc(x.contact)+'</td><td>'+esc(x.status)+'</td></tr>').join('')}catch(e){toast(e.message)}}$('load').onclick=loadLeads;loadAuth();loadLeads();
</script></body></html>
